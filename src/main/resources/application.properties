# --- Conexão com o MySQL ---
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3307/api_prontuario?createDatabaseIfNotExist=true&serverTimezone=UTC}
spring.datasource.username=${DB_USER:root}
spring.datasource.password=${DB_PASSWORD:}

# --- Configurações do JPA / Hibernate ---
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

# --- Chave Secreta do JWT (lida pelo TokenService) ---
api.security.token.secret=${JWT_SECRET:12345678_chave_super_secreta_padrao}

# --- Swagger UI & Logs ---
springdoc.swagger-ui.persistAuthorization=true
logging.level.org.springframework.security=INFO